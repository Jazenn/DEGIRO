name: Synthetic staging crypto market history
on:
  workflow_dispatch:
  schedule:
    - cron: '29 0 * * *'
permissions:
  contents: read
concurrency:
  group: synthetic-staging-verification
  cancel-in-progress: false
jobs:
  publish:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/useful-dashboard') && (github.event_name == 'workflow_dispatch' || vars.STAGING_CRYPTO_HISTORY_ENABLED == 'true')
    environment: synthetic-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish verified complete public EUR windows to synthetic staging only
        env:
          STAGING_PUBLISHER_DATABASE_URL: ${{ secrets.STAGING_PUBLISHER_DATABASE_URL }}
          STAGING_EXPECTED_HOST: ${{ secrets.STAGING_EXPECTED_HOST }}
          STAGING_EXPECTED_DATABASE: ${{ secrets.STAGING_EXPECTED_DATABASE }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          STAGING_CRYPTO_HISTORY_APPROVED: synthetic-staging-only
        run: python -m backend.staging_crypto_market

name: Price Fetcher

on:
  schedule:
    # 22:00 CET (21:00 UTC) on weekdays (market close snapshot archive)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [degiro_csv_uploaded, refresh_prices]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetcher & Snapshot Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backend.cli snapshot

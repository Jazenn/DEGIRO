name: Price Fetcher

on:
  schedule:
    # 08:00-22:00 CET (UTC+1 in winter) on weekdays.
    - cron: '0 7-21 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetcher
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python fetcher.py
